<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Padaria</title>
</head>
<body>
    <h1>Nossos pães</h1>

    {% for produto in produtos %}
        <div>
            <h2>{{ produto.nome }}</h2>
            <p>{{ produto.descricao }}</p>
            <p>R$ {{ produto.preco }}</p>
        </div>
    {% empty %}
        <p>Nenhum produto disponível no momento.</p>
    {% endfor %}
</body>
</html>
